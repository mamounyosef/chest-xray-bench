# =============================================================================
# config.yaml  —  experiment: medmae_vitb_nih_A_512_s1
#   RUN A, STAGE 1 of a 2-stage HIGH-RES continue of our best 3-way arm
#   (medmae_vitb_nih, 0.8891 mean AUROC @384x320). Run A = "staged continue":
#   warm-start from the CONVERGED medmae_vitb_nih checkpoint (KEEP its trained
#   5-class head) and adapt it upward in resolution in two stages:
#       Stage 1 (THIS run): 512x432   -> best.pt feeds Stage 2
#       Stage 2           : 768x640   (medmae_vitb_nih_A_768_s2)
# -----------------------------------------------------------------------------
# WARM-START (not resume): model.checkpoint_path points at the medmae_vitb_nih
# run's best.pt on the runs volume. build_medmae_vit loads it, KEEPS the 5-class
# head (keep_head:true, shapes match), and BICUBICALLY RESAMPLES the absolute
# pos_embed from that run's 24x20 grid to THIS stage's 32x27 grid (512/16 x 432/16
# = 32x27 = 864 tokens). resume stays null so a FRESH short schedule runs (optimizer
# /step NOT restored) — a 200-step linear LR warmup then cosine, exactly the intended
# per-stage jump behavior.
# -----------------------------------------------------------------------------
# DATA = the NATIVE full-res tree (chexpert-native-data, /data_native/CheXpert-v1.0):
# CheXpert-small is ~320px and cannot supply real >=512 detail. paths.path_remap
# reroutes the file lookup small->CheXpert-v1.0 with NO CSV edits (same trick as
# convnext_base_22k_768x640). Split CSVs + 01_train_softlabels.csv live in
# /data_native/splits.
# Holds only what VARIES per experiment; common settings come from ../shared_config.yaml.
# =============================================================================

experiment:
  name: "medmae_vitb_nih_A_512_s1"

# ----------------------------------------------------------------------------
# Model  —  Medical-MAE ViT-B/16 (global-avg-pool fine-tune arch), warm-started
# from the CONVERGED medmae_vitb_nih run's best.pt (its trained 5-class head KEPT).
# checkpoint_path is on the runs volume (mounted at /runs on Modal). pretrained:false
# — timm downloads nothing; weights come from checkpoint_path, pos_embed resampled
# to this stage's 32x27 grid inside build_medmae_vit.
# ----------------------------------------------------------------------------
model:
  name: "vit_base_patch16_224"     # timm ViT-B/16 arch id (img_size overridden to 432x512)
  arch: "medmae_vitb"
  global_pool: "avg"               # fc_norm classifier — matches Medical-MAE fine-tune
  pretrained: false                # weights come from checkpoint_path, not the timm hub
  checkpoint_path: "/runs/medmae_vitb_nih/results/checkpoints/best.pt"
  checkpoint_kind: "chexpert_run"  # our converged CheXpert model (medmae_vitb_nih best.pt)
  keep_head: true                  # KEEP the trained 5-class head (staged continue)

reproducibility:
  seed: 42

# Fresh short schedule for the stage jump — NOT a resume (optimizer/step not restored).
resume: null

# ----------------------------------------------------------------------------
# Label policy  —  IDENTICAL to medmae_vitb_nih (U-Ones except Consolidation
# U-SelfTrained). selftrained_csv must sit at /data_native/splits/01_train_softlabels.csv.
# ----------------------------------------------------------------------------
labels:
  u_policy: "mixed"
  per_task:
    Atelectasis:      "ones"
    Cardiomegaly:     "ones"
    Consolidation:    "selftrained"
    Edema:            "ones"
    Pleural Effusion: "ones"
  selftrained_csv: "01_train_softlabels.csv"
  val_ignore_uncertain: false

clahe:
  use_clahe: false
  clip_limit: 2.0
  tile_grid:  [8, 8]

# ----------------------------------------------------------------------------
# Image geometry  —  STAGE-1 resolution 512x432 (32x27 patch grid, 864 tokens).
# resize_pad fits aspect-preserving inside (width,height) then center zero-pads.
# interpolation / channels / normalization inherit from ../shared_config.yaml.
# ----------------------------------------------------------------------------
image:
  width:  512
  height: 432

# ----------------------------------------------------------------------------
# DataLoader  —  heavier tensors than 384x320, so prefetch trimmed to 2 (as in the
# native 768 convnext run). batch 64, no grad accumulation (H200 has the headroom).
# ----------------------------------------------------------------------------
dataloader:
  batch_size:         64
  num_workers:        30
  pin_memory:         true
  prefetch_factor:    4
  persistent_workers: true
  drop_last:          false
  val_batch_size:         256
  val_num_workers:        24
  val_pin_memory:         true
  val_prefetch_factor:    4
  val_persistent_workers: true

performance:
  channels_last: true
  fused_optimizer: true
  compile: true
  compile_mode: "default"

# ----------------------------------------------------------------------------
# Training  —  RUN A LR: 3.0e-5 -> 3.0e-7 (1%), LLRD 0.75. 200-step LINEAR warmup
# at the stage jump, then cosine. Stage 1 = 1 epoch (Run A total 4 epochs = 1 + 3).
# ----------------------------------------------------------------------------
training:
  epochs:        1
  amp:           true
  grad_clip:     1.0

  optimizer:
    lr:           3.0e-5
    weight_decay: 1.0e-5
    layer_decay:  0.75

  scheduler:
    name:        "cosine"
    warmup_steps: 400        # absolute-step linear warmup (from ~0 -> base) at the jump
    min_lr:      6.0e-6      # 20% of lr — short 1-epoch stage, don't decay to near-zero
    plateau_patience: 2

  loss:
    name: "bce_with_logits"
    pos_weight: null
    label_smoothing: 0.05

  early_stopping:
    enable:   true
    monitor:  "val_mean_auroc"
    mode:     "max"
    patience: 11

evaluation:
  metric: "mean_auroc"
  eval_level: "image"
  eval_every_epochs: null
  eval_every_steps: 400

# ----------------------------------------------------------------------------
# Paths  —  reroute image FILE lookup to the NATIVE tree WITHOUT editing the CSVs
# (same as convnext_base_22k_768x640). train_csv/val_csv stay 01_train/01_val.
# ----------------------------------------------------------------------------
paths:
  path_remap:
    from: "CheXpert-v1.0-small"
    to:   "CheXpert-v1.0"

# ----------------------------------------------------------------------------
# Modal  —  H200 (no grad accumulation). NATIVE full-res volume mounted at
# /data_native; the runs volume (/runs) is where the medmae_vitb_nih checkpoint is
# read from and this stage's best.pt is written for Stage 2.
# ----------------------------------------------------------------------------
modal:
  gpu: "A100"
  cpu_cores: 24
  memory_gb: 50
  timeout_seconds: 43200
  data_volume: "chexpert-native-data"
  runs_volume: "chexpert-runs"
  data_mount:  "/data_native"
  runs_mount:  "/runs"
  remote_data_root: "/data_native/CheXpert-v1.0"   # + path_remap small->CheXpert-v1.0
  remote_data_dir:  "/data_native/splits"
  wandb_secret: "wandb-secret"
