# =============================================================================
# shared_config.yaml  —  settings COMMON to every experiment
# -----------------------------------------------------------------------------
# Only the truly-stable, obvious-to-share settings live here. Each experiment's
# own config.yaml holds what varies (experiment, model, labels, clahe, dataloader,
# training, evaluation) and is deep-merged on top of this (experiment wins).
# =============================================================================

# ----------------------------------------------------------------------------
# Paths
# ----------------------------------------------------------------------------
paths:
  data_root:    "D:/CheXpert-v1.0-small"
  data_dir:     "d:/My Projects/chest-xray-bench/data/chexpert"
  train_csv:    "01_train.csv"        # patient-grouped 90% (NLP labels)
  val_csv:      "01_val.csv"          # patient-grouped 10% (NLP labels, in-loop val)
  valid200_csv: "01_valid200.csv"     # official 200-study radiologist set (report only)
  test500_csv:  "01_test500.csv"      # official 500-study radiologist set (report only)

# ----------------------------------------------------------------------------
# Tasks  —  the 5 competition pathologies (headline = mean AUROC). Order fixes
# the column order of every label tensor & metric vector.
# ----------------------------------------------------------------------------
tasks:
  - Atelectasis
  - Cardiomegaly
  - Consolidation
  - Edema
  - Pleural Effusion

# ----------------------------------------------------------------------------
# Image geometry & normalization  —  aspect-preserving fit inside (W,H) + center
# zero-pad. ImageNet normalization (pretrained backbone). Grayscale -> 3 channels.
# ----------------------------------------------------------------------------
image:
  width:  384
  height: 320
  interpolation: "INTER_AREA"
  channels: 3
  norm_mean: [0.485, 0.456, 0.406]
  norm_std:  [0.229, 0.224, 0.225]
  # gpu_normalize: dataset ships raw 1-channel uint8 and the GPU does /255 +
  # channel-expand + ImageNet-normalize (see prepare_batch). 4x smaller host->GPU
  # transfer + /dev/shm than shipping float32 — the fix for high-res OOM/shm. Augmentation
  # still runs in the worker, so results match the CPU path bar a uint8 round (negligible).
  # Set false to normalize on CPU (ship float32) — kept only as an escape hatch.
  gpu_normalize: true

# ----------------------------------------------------------------------------
# Augmentation  —  TRAIN SPLIT ONLY. Each aug rolls its OWN independent p.
# NO flips (cardiac laterality). enable=false disables all at once.
# ----------------------------------------------------------------------------
augmentation:
  enable: true
  rotation:                   # random rotation in +/- deg
    p:   0.2
    deg: 5
  translate:                  # random shift, +/- fraction of W/H
    p:    0.2
    frac: 0.05
  scale:                      # random zoom factor sampled in range
    p:     0.2
    range: [0.95, 1.05]
  brightness:                 # +/- fraction
    p:      0.2
    factor: 0.10
  contrast:                   # +/- fraction
    p:      0.2
    factor: 0.10

# ----------------------------------------------------------------------------
# Debug images  —  every N steps, save ONE random image from the batch exactly
# as the model sees it (post CLAHE / augment / pad / normalize, then
# un-normalized so it's viewable) to results/<dir>/e{EPOCH}_{EPOCH_STEP}.png.
# Assurance that preprocessing & augmentation look right. 0 = disabled.
# ----------------------------------------------------------------------------
debug:
  save_images_every: 400
  dir: "debugged_images"

# ----------------------------------------------------------------------------
# Reproducibility
# ----------------------------------------------------------------------------
reproducibility:
  seed: 42
  deterministic: true

# ----------------------------------------------------------------------------
# Validation  —  extra subsets scored at EACH in-training validation, IN ADDITION
# to the primary val_csv. REPORT-ONLY: they NEVER drive best.pt or early stopping
# (those stay on val_csv, so the controlled comparison is unchanged). Each subset's
# metrics are written to val_log.csv as "<name>_<metric>" columns and to W&B under
# "<name>/...". Per subset:
#   name   : short label used in the logs / prints
#   csv    : split CSV under paths.data_dir (resolved like train_csv / val_csv)
#   enable : turn a subset on/off without deleting the entry
# Leave extra_subsets empty (or all enable:false) to restore the old single-val
# behavior (schema then byte-identical to before).
# ----------------------------------------------------------------------------
validation:
  # Which subset the BEST checkpoint + EARLY STOPPING track (training.early_stopping
  # still picks the metric, e.g. val_mean_auroc — this picks the DATA it's read from):
  #   "val"        : the primary 10% val_csv (default / previous behavior)
  #   "<name>"     : one of the extra_subsets below (e.g. "valid200")
  # A named subset must be enabled; if it's missing/disabled at runtime, best/early-
  # stop fall back to "val" with a warning.
  monitor_subset: "valid200"
  extra_subsets:
    - name: "valid200"
      csv: "01_valid200.csv"       # official 200-study radiologist set
      enable: true

# ----------------------------------------------------------------------------
# Weights & Biases  —  live metric visualization (same scores as the CSV logs;
# NO system/GPU stats). Run name = experiment name. Needs WANDB_API_KEY as a
# Modal secret (see modal.wandb_secret). enabled=false -> no tracking.
#   log_every : log TRAIN metrics every N steps (val is logged every validation)
# ----------------------------------------------------------------------------
wandb:
  enabled: true
  project: "chest-xray-bench"
  log_every: 20

# ----------------------------------------------------------------------------
# Output  —  written into each experiment's results/ folder:
#     results/checkpoints/   <- rolling last-N + best.pt
#     results/train_log.csv  <- one row per training step
#     results/val_log.csv    <- one row per validation
#   plus train_config/<datetime>.txt  <- full terminal capture of each run
# ----------------------------------------------------------------------------
output:
  run_dir:        "results"
  checkpoints_dir: "checkpoints"
  best_name:       "best.pt"
  train_log_csv:   "train_log.csv"
  val_log_csv:     "val_log.csv"
  summary_json:    "training_summary.json"   # best-so-far metrics snapshot (live)
  console_capture_dir: "train_config"
  console_log_every: 20
  checkpoint_every_steps: 300
  keep_last_n: 35
  # keep_last_n lives in each experiment's config.yaml (output: keep_last_n)
